<div class="app-shell" id="app-shell">

         ======================================================== -->
    <header class="topbar" role="banner" aria-label="Email Audit Dashboard header">

        <!-- Brand -->

                <span class="topbar-title">Email Audit Dashboard</span>
                <span class="topbar-subtitle" id="hdr-subtitle">Campaign QA Results</span>
            </div>
        </div>

        <!-- Email selector -->
        <div class="topbar-controls">
            <div class="email-selector-wrap" role="group" aria-label="Email selection">
                <label class="sr-only" for="email-select">Select email campaign</label>
                <div class="custom-select-wrap">
                    <select id="email-select" class="email-select" aria-label="Select email campaign">
                        <option value="">— Select an email campaign —</option>
                    </select>
                    <span class="custom-select-arrow" aria-hidden="true">&#9662;</span>

            <button class="topbar-btn" id="btn-export" aria-label="Export audit report">
                <span aria-hidden="true">&#8681;</span> Export Report
