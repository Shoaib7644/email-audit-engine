<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Audit Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

<div class="app-shell">

    <!-- ================================================= -->
    <!-- TOPBAR                                            -->
    <!-- ================================================= -->
    <header class="topbar">
        <div class="topbar-brand">
            <div class="topbar-icon">EA</div>
            <div>
                <div class="topbar-title">Email Audit Dashboard</div>
            </div>
        </div>
        <div class="topbar-stats">
            <div class="topbar-stat">
                <span class="topbar-stat-dot green"></span>
                <span class="topbar-stat-val" id="tb-passed">0</span>
                <span>passed</span>
            </div>
            <div class="topbar-stat">
                <span class="topbar-stat-dot red"></span>
                <span class="topbar-stat-val" id="tb-failed">0</span>
                <span>failed</span>
            </div>

            <!-- skipped file count (hidden when 0) -->
            <div class="topbar-stat" id="tb-skipped-wrap" style="display:none">
                <span class="topbar-stat-dot amber"></span>
                <span class="topbar-stat-val" id="tb-skipped">0</span>
                <span>skipped</span>
            </div>

            <!-- execution time (hidden until JS populates it) -->
            <div class="topbar-stat" id="tb-exec-time-wrap" style="display:none">
                <span id="tb-exec-time" style="font-size:12px;color:var(--text-secondary)"></span>
            </div>

            <div class="topbar-stat">
                <span id="tb-generated" style="font-size:12px;color:var(--text-muted)"></span>
            </div>
        </div>
    </header>

    <!-- ================================================= -->
    <!-- SIDEBAR                                           -->
    <!-- ================================================= -->
    <aside class="sidebar">
        <div class="sidebar-search-wrap">
            <span class="sidebar-search-icon">&#9906;</span>
            <input
                    id="sidebar-search"
                    class="sidebar-search"
                    type="search"
                    placeholder="Filter emails&hellip;"
                    autocomplete="off"
                    aria-label="Filter emails"
            />
        </div>
        <div class="sidebar-list-label">Emails</div>
        <div class="sidebar-list" id="sidebar-list" role="listbox" aria-label="Email list">
            <div class="sidebar-empty">No audit data loaded.</div>
        </div>
    </aside>

    <!-- ================================================= -->
    <!-- MAIN PANEL                                        -->
    <!-- ================================================= -->
    <main class="main-panel" id="main-panel">
        <div class="welcome-state" id="welcome-state">
            <div class="welcome-icon">&#9993;</div>
            <h2>Select an email to review</h2>
            <p>Choose an email from the sidebar to see its audit results and findings.</p>
        </div>
        <div id="detail-view" style="display:none"></div>
    </main>

</div>

<!-- ================================================= -->
<!-- DATA INJECTION                                    -->
<!-- ================================================= -->
<script>
    /* global DASHBOARD_DATA */
    var DASHBOARD_DATA = {{DASHBOARD_DATA}};

    /*
     * AUDIT_EXECUTION_TIME_MS is populated one of two ways (pick whichever
     * is easier on the Java side):
     *
     * WAY 1 — inject into the JSON object (recommended, zero JS change):
     *   In your DTO / builder add:  executionTimeMs = 28679L
     *   The JS in dashboard.js already reads data.executionTimeMs.
     *
     * WAY 2 — inject as a separate placeholder (use this if you cannot
     *   touch the DTO):
     *   In ReportTemplateRenderer.java:
     *     html = html.replace("{{EXECUTION_TIME_MS}}", String.valueOf(runDurationMs));
     *
     *   The self-invoking function below reads it safely; if the placeholder
     *   was NOT replaced (older renderer) it returns null and the topbar
     *   timing chip stays hidden — no crash.
     */
    var AUDIT_EXECUTION_TIME_MS = (function () {
        try {
            var raw = "{{EXECUTION_TIME_MS}}";
            if (raw.indexOf("{{") === 0) { return null; }   /* placeholder not replaced */
            var n = Number(raw);
            return isNaN(n) ? null : n;
        } catch (_) { return null; }
    }());
</script>

<script src="dashboard.js"></script>

</body>
</html>
