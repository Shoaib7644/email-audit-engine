<!DOCTYPE html>

<!--
  Email Audit Dashboard  —  V2
  ============================================================
  Entry point only.  All logic lives in js/*.js.
  Data contract (injected by Java engine at {{DASHBOARD_DATA}}):
  {
    client        : string,
    validationMode: "PRE_SEND" | "POST_SEND",
    inputSource   : string,
    passedFiles   : number,
    failedFiles   : number,
    generatedAt   : ISO-8601 string,
    files: [{
      fileName        : string,
      overallStatus   : "PASS" | "FAIL" | "ERROR" | "SKIPPED",
      failedChecks    : number,
      screenshotPath  : string | null,
      links: [{
        visibleText     : string,
        originalUrl     : string,
        finalUrl        : string,
        linkType        : string,
        validationNote  : string,
	        validationStatus: "PASS" | "FAIL" | "SKIPPED" | "PROTECTED",
	        reason          : string,
	        pageTitle       : string,
	        httpStatus      : number | null,
	        statusText      : string,
	        redirectCount   : number | null,
	        redirectChain   : string[],
	        responseTimeMs  : number | null,
	        screenshotPath  : string | null,
	        element         : string,
	        ariaLabel       : string,
	        title           : string,
	        target          : string,
	        domIndex        : number | null,
	        bounds          : string
	      }],
      images: [{
        imageUrl        : string,
        altText         : string,
        httpStatus      : number | null,
        validationStatus: "PASS" | "FAIL" | "WARNING",
        warning         : boolean,
        naturalWidth    : number | null,
        naturalHeight   : number | null,
        displayWidth    : number | null,
        displayHeight   : number | null,
        imageLoaded     : boolean,
        rendered        : boolean,
        screenshotPath  : string | null,
        thumbnailPath   : string | null,
        notes           : string,
        bounds          : string,
        imageType       : string
      }],
      rules: [{
        ruleId          : string,
        ruleName        : string,
        status          : "PASS" | "FAIL" | "ERROR" | "SKIPPED",
        severity        : "CRITICAL" | "HIGH" | "MEDIUM" | "LOW" | "INFO",
        findings        : string[],
        businessImpact  : string,
        errorMessage    : string
      }]
    }]
  }
  ============================================================
-->

<!-- ============================================================
     DATA INJECTION  (Java engine replaces {{DASHBOARD_DATA}})
     ============================================================ -->
<script>
    /* ----------------------------------------------------------------
       DASHBOARD_DATA is injected by the Java audit engine at build time.
       The engine replaces the {{DASHBOARD_DATA}} token with a raw JSON
       object literal — identical to how the original dashboard.html works.
       The try/catch keeps the file openable from disk without the engine.
    ---------------------------------------------------------------- */
    var DASHBOARD_DATA;
    try {
        DASHBOARD_DATA = {{DASHBOARD_DATA}};
    } catch (e) {
        DASHBOARD_DATA = null;
    }
</script>
